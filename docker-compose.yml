services:
  postgres:
    image: postgres:17
    container_name: task-postgres
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskdb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build: .
    container_name: task-api

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env.docker

    ports:
      - "3000:3000"

volumes:
  postgres_data:
